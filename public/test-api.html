<!DOCTYPE html>
<html>
<head>
    <title>Test Register API</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        input { display: block; width: 300px; padding: 5px; margin: 5px 0; }
        button { padding: 10px 20px; cursor: pointer; }
        pre { background: #f0f0f0; padding: 15px; border-radius: 5px; max-height: 400px; overflow-y: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test API Register</h1>
    <button onclick="testRegister()">Probar Registro</button>
    <button onclick="clearLog()">Limpiar</button>
    
    <h2>Log:</h2>
    <pre id="output"></pre>

    <script>
        const log = (msg, isError = false) => {
            const el = document.getElementById('output');
            const span = document.createElement('div');
            span.textContent = msg;
            if (isError) span.className = 'error';
            el.appendChild(span);
            el.scrollTop = el.scrollHeight;
        };
        
        const clearLog = () => document.getElementById('output').innerHTML = '';

        const testRegister = async () => {
            clearLog();
            log('Iniciando test...');
            
            const data = {
                name: 'Test ' + Date.now(),
                email: 'test' + Date.now() + '@example.com',
                password: 'password123',
                password_confirmation: 'password123',
                institucion: 'BUAP',
                nivel: 'universidad',
                licenciatura: 'Biotecnología',
                semestre: '6',
                tipo_inscripcion: 'asistente'
            };
            
            log('Datos enviados: ' + JSON.stringify(data, null, 2));
            
            try {
                log('Enviando solicitud POST...');
                const response = await fetch('http://localhost:8000/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                log(`Status: ${response.status} ${response.statusText}`);
                const json = await response.json();
                log('Response: ' + JSON.stringify(json, null, 2));
                
                if (response.ok) {
                    log('✓ Registro exitoso!', false);
                } else {
                    log('✗ Error en la respuesta', true);
                }
            } catch (error) {
                log('✗ Error de conexión: ' + error.message, true);
            }
        };
    </script>
</body>
</html>
