<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test API</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        pre { background: #f0f0f0; padding: 10px; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Test API EEBB 2026</h1>
    
    <h2>Prueba de Registro</h2>
    <button onclick="testRegister()">Probar Registro</button>
    <pre id="registerResult"></pre>

    <h2>Prueba de Login</h2>
    <button onclick="testLogin()">Probar Login</button>
    <pre id="loginResult"></pre>

    <script>
        const API = "http://localhost:8000/api";

        async function testRegister() {
            const data = {
                name: "Test User " + Date.now(),
                email: "test" + Date.now() + "@example.com",
                password: "password123",
                password_confirmation: "password123",
                institucion: "BUAP",
                nivel: "universidad",
                licenciatura: "Biotecnología",
                semestre: 6,
                tipo_inscripcion: "asistente"
            };

            try {
                const response = await fetch(`${API}/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const json = await response.json();
                document.getElementById("registerResult").textContent = 
                    `Status: ${response.status}\n\n${JSON.stringify(json, null, 2)}`;
            } catch (error) {
                document.getElementById("registerResult").textContent = "Error: " + error.message;
            }
        }

        async function testLogin() {
            const data = {
                email: "test@example.com",
                password: "password123"
            };

            try {
                const response = await fetch(`${API}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(data)
                });
                
                const json = await response.json();
                document.getElementById("loginResult").textContent = 
                    `Status: ${response.status}\n\n${JSON.stringify(json, null, 2)}`;
            } catch (error) {
                document.getElementById("loginResult").textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
